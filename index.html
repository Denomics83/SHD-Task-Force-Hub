<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="stf-build" content="a171f07">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D10">
  <meta name="description" content="Shade Task Force Hub — Division 2 clan updates, events, loot, builds, and resources.">
  <title>Updates — Shade Task Force Hub</title>
  <link rel="icon" href="assets/clan-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=a171f07">
</head>
<body class="page-updates">
  <div id="topbar-root"></div>

  <main class="wrap updates-page">
    <div class="upd-list" id="update-feed" aria-live="polite">
      <p class="lede">Loading updates…</p>
    </div>
    <article class="upd-detail" id="update-detail" hidden></article>
  </main>

  <div id="bottomnav-root"></div>
  <script src="js/common.js?v=a171f07"></script>
  <script src="js/updates.js?v=a171f07"></script>
<script data-stf-toast>
(function () {
  var meta = document.querySelector('meta[name="stf-build"]');
  var current = meta ? meta.content : "";
  fetch("data/build-version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (doc) {
      if (!doc || !doc.version || doc.version === current) return;
      if (document.querySelector(".build-toast")) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "build-toast";
      btn.textContent = "New version available — tap to refresh";
      btn.addEventListener("click", function () { location.reload(); });
      document.body.appendChild(btn);
    })
    .catch(function () {});
})();
</script>
</body>
</html>
