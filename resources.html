<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="stf-build" content="ad4b6b4">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D10">
  <title>Resources — Shade Task Force Hub</title>
  <link rel="icon" href="assets/clan-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=ad4b6b4">
</head>
<body class="page-resources">
  <div id="topbar-root"></div>

  <main>
    <section class="res-landing" id="res-landing" aria-label="Resource categories">
      <button type="button" class="cat-tile col-tile" data-res="maps">
        <span class="col-title">Maps</span>
        <span class="col-ring"><svg viewBox="0 0 24 24"><path d="M4 6.5 9 4.5l6 2 5-2v13l-5 2-6-2-5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg></span>
        <span class="col-count">—</span>
      </button>
      <button type="button" class="cat-tile col-tile" data-res="hunters">
        <span class="col-title">Hunter Guides</span>
        <span class="col-ring"><svg viewBox="0 0 24 24"><path d="M5 11c1.4-4 12.6-4 14 0v4.5c-1.6 3.6-12.4 3.6-14 0z"/><path d="M9 12.2h.1M15 12.2h.1"/></svg></span>
        <span class="col-count" id="col-hunters">—</span>
      </button>
      <button type="button" class="cat-tile col-tile" data-res="creators">
        <span class="col-title">Creators</span>
        <span class="col-ring"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="12" height="9"/><path d="M16 10.5 20 8.5v7l-4-2z"/></svg></span>
        <span class="col-count">—</span>
      </button>
      <a class="cat-tile col-tile" href="admin.html#events">
        <span class="col-title">Events</span>
        <span class="col-ring"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15"/><path d="M8 3.5v3M16 3.5v3M4 9.5h16"/></svg></span>
        <span class="col-count">—</span>
      </a>
    </section>

    <section class="wrap res-detail" id="res-detail" hidden>
      <button type="button" class="back-link" id="res-back" hidden>← Resources</button>
      <div id="res-detail-body"></div>
    </section>
  </main>

  <div id="bottomnav-root"></div>
  <script src="js/common.js?v=ad4b6b4"></script>
  <script src="js/resources.js?v=ad4b6b4"></script>
<script data-stf-toast>
(function () {
  var meta = document.querySelector('meta[name="stf-build"]');
  var current = meta ? meta.content : "";
  fetch("data/build-version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (doc) {
      if (!doc || !doc.version || doc.version === current) return;
      if (document.querySelector(".build-toast")) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "build-toast";
      btn.textContent = "New version available — tap to refresh";
      btn.addEventListener("click", function () { location.reload(); });
      document.body.appendChild(btn);
    })
    .catch(function () {});
})();
</script>
</body>
</html>
