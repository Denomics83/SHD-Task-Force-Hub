<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="stf-build" content="35a555b">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D10">
  <title>Resources — Shade Hub</title>
  <link rel="icon" href="assets/clan-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=35a555b">
</head>
<body class="page-resources">
  <div id="topbar-root"></div>

  <main class="res-shell">
    <div class="res-tabs" role="tablist" aria-label="Resources">
      <button type="button" role="tab" data-tab="builds" aria-selected="true">Builds</button>
      <button type="button" role="tab" data-tab="maps" aria-selected="false">Maps</button>
      <button type="button" role="tab" data-tab="hunters" aria-selected="false">Hunters</button>
      <button type="button" role="tab" data-tab="creators" aria-selected="false">Creators</button>
    </div>

    <div id="tab-builds" class="res-panel" role="tabpanel">
      <div id="cat-stage" class="cat-stage" aria-label="Build categories"></div>
      <div id="build-list" class="wrap build-list" hidden>
        <h1 id="list-title">Builds</h1>
        <div id="list-rows" class="build-rows"></div>
      </div>
      <div id="build-detail" class="wrap build-detail" hidden>
        <div id="detail-body"></div>
      </div>
    </div>

    <div id="tab-maps" class="res-panel wrap" role="tabpanel" hidden>
      <div id="maps-body"><p class="lede">Loading maps…</p></div>
    </div>

    <div id="tab-hunters" class="res-panel wrap res-detail" role="tabpanel" hidden>
      <div id="res-detail-body"></div>
    </div>

    <div id="tab-creators" class="res-panel wrap" role="tabpanel" hidden>
      <div id="creators-body"><p class="lede">Loading creators…</p></div>
    </div>
  </main>

  <div id="bottomnav-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="js/supabase.js?v=35a555b"></script>
  <script src="js/common.js?v=35a555b"></script>
  <script src="js/resources.js?v=35a555b"></script>
  <script src="js/builds.js?v=35a555b"></script>
<script data-stf-toast>
(function () {
  var meta = document.querySelector('meta[name="stf-build"]');
  var current = meta ? meta.content : "";
  fetch("data/build-version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (doc) {
      if (!doc || !doc.version || doc.version === current) return;
      if (document.querySelector(".build-toast")) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "build-toast";
      btn.textContent = "New version available — tap to refresh";
      btn.addEventListener("click", function () { location.reload(); });
      document.body.appendChild(btn);
    })
    .catch(function () {});
})();
</script>
</body>
</html>
