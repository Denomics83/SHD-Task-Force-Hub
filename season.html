<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="stf-build" content="a171f07">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0C0E">
  <title>Season — Shade Task Force Hub</title>
  <link rel="icon" href="assets/clan-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=a171f07">
</head>
<body>
  <div id="topbar-root"></div>

  <main class="wrap">
    <div class="eyebrow">Current season</div>
    <h1 id="season-title">Season</h1>
    <p class="lede" id="season-summary">Loading…</p>

    <div class="subtabs" id="season-tabs" role="tablist" aria-label="Season sections">
      <button type="button" class="subtab" role="tab" data-panel="manhunts" aria-selected="true">Manhunts</button>
      <button type="button" class="subtab" role="tab" data-panel="journey" aria-selected="false">Journey</button>
      <button type="button" class="subtab" role="tab" data-panel="modifiers" aria-selected="false">Modifiers</button>
    </div>
    <p class="season-theme" id="season-theme" hidden></p>

    <div id="panel-manhunts" class="season-panel active season-list" role="tabpanel"></div>
    <div id="panel-journey" class="season-panel season-list" role="tabpanel"></div>
    <div id="panel-modifiers" class="season-panel season-list" role="tabpanel"></div>

    <footer class="site-foot">
      Season detail opens from the season card on Updates or Events. It is not a bottom-nav tab.
      Theme, journey, manhunt, and modifiers are edited in <code>admin.html</code>.
    </footer>
  </main>

  <div id="bottomnav-root"></div>
  <script src="js/common.js?v=a171f07"></script>
  <script src="js/season.js?v=a171f07"></script>
<script data-stf-toast>
(function () {
  var meta = document.querySelector('meta[name="stf-build"]');
  var current = meta ? meta.content : "";
  fetch("data/build-version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (doc) {
      if (!doc || !doc.version || doc.version === current) return;
      if (document.querySelector(".build-toast")) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "build-toast";
      btn.textContent = "New version available — tap to refresh";
      btn.addEventListener("click", function () { location.reload(); });
      document.body.appendChild(btn);
    })
    .catch(function () {});
})();
</script>
</body>
</html>
