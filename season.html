<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0C0E">
  <title>Season — Shade Task Force Hub</title>
  <link rel="icon" href="assets/clan-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="topbar-root"></div>

  <main class="wrap">
    <div class="eyebrow">Current season</div>
    <h1 id="season-title">Season</h1>
    <p class="lede" id="season-summary">Loading…</p>

    <div class="subtabs" id="season-tabs" role="tablist" aria-label="Season sections">
      <button type="button" class="subtab" role="tab" data-panel="manhunts" aria-selected="true">Manhunts</button>
      <button type="button" class="subtab" role="tab" data-panel="journey" aria-selected="false">Journey</button>
      <button type="button" class="subtab" role="tab" data-panel="maps" aria-selected="false">Maps</button>
      <button type="button" class="subtab" role="tab" data-panel="modifiers" aria-selected="false">Modifiers</button>
      <button type="button" class="subtab" role="tab" data-panel="global" aria-selected="false">Global Modifiers</button>
    </div>
    <p class="season-theme" id="season-theme">Add the season theme here</p>

    <div id="panel-manhunts" class="season-panel active season-list" role="tabpanel"></div>
    <div id="panel-journey" class="season-panel season-list" role="tabpanel"></div>
    <div id="panel-maps" class="season-panel season-list" role="tabpanel"></div>
    <div id="panel-modifiers" class="season-panel season-list" role="tabpanel"></div>
    <div id="panel-global" class="season-panel season-list" role="tabpanel"></div>

    <footer class="site-foot">
      Season detail opens from the season card on Updates or Events. It is not a bottom-nav tab.
      Theme, journey, manhunt, modifiers, and maps are edited in <code>admin.html</code>.
    </footer>
  </main>

  <div id="bottomnav-root"></div>
  <script src="js/common.js"></script>
  <script src="js/season.js"></script>
</body>
</html>
