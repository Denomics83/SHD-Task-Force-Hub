<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="stf-build" content="35a555b">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D10">
  <title>Chat — Shade Hub</title>
  <link rel="icon" href="assets/clan-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=35a555b">
</head>
<body class="page-chat">
  <div id="topbar-root"></div>
  <main class="chat-screen">
    <p class="chat-note">Clan chat</p>
    <div id="chat-log" class="chat-log" aria-live="polite"></div>
    <form id="chat-form" class="chat-form">
      <input name="body" maxlength="500" autocomplete="off" placeholder="Message the clan" aria-label="Message">
      <button type="submit">Send</button>
    </form>
  </main>
  <div id="bottomnav-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="js/supabase.js?v=35a555b"></script>
  <script src="js/common.js?v=35a555b"></script>
  <script src="js/chat.js?v=35a555b"></script>
<script data-stf-toast>
(function () {
  var meta = document.querySelector('meta[name="stf-build"]');
  var current = meta ? meta.content : "";
  fetch("data/build-version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (doc) {
      if (!doc || !doc.version || doc.version === current) return;
      if (document.querySelector(".build-toast")) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "build-toast";
      btn.textContent = "New version available — tap to refresh";
      btn.addEventListener("click", function () { location.reload(); });
      document.body.appendChild(btn);
    })
    .catch(function () {});
})();
</script>
</body>
</html>
