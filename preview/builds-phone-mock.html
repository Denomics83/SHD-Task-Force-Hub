<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Shade Task Force — Builds mock</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181f;
    --border: #2a313c;
    --orange: #ff7f00;
    --text: #f2f4f7;
    --muted: #8a9099;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: #050607;
    color: var(--text); font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    display: grid; place-items: center; padding: 16px;
  }
  .phone {
    width: min(390px, 100%); height: min(780px, 92dvh);
    background: var(--bg); border: 1px solid var(--border); border-radius: 28px;
    overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  header {
    padding: 16px 18px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 1.1rem; }
  header p {
    margin: 3px 0 0; font-size: .65rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);
  }
  .grid {
    flex: 1; overflow-y: auto; padding: 14px; display: grid;
    grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: 12px; min-height: 0;
  }
  .card {
    position: relative; border-radius: 16px; border: 1.5px solid var(--accent);
    background: var(--panel); overflow: hidden; display: flex; flex-direction: column;
    justify-content: flex-end; min-height: 0; box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .viz {
    flex: 1; margin: 12px 12px 0; border-radius: 12px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 35%, #10141c), #0e1218 70%);
    display: grid; place-items: center; position: relative; overflow: hidden;
  }
  .viz svg { width: 58%; height: 58%; opacity: .95; }
  .card h2 {
    margin: 0; padding: 10px 12px 12px; font-size: .95rem; letter-spacing: .06em;
    text-transform: uppercase; text-align: center; color: #fff;
  }
  .solo { --accent: #ff7f00; }
  .team { --accent: #2dd4bf; }
  .incursion { --accent: #ef4444; }
  .escalation { --accent: #a855f7; }
  .raid { --accent: #f59e0b; }
  .pvp { --accent: #3b82f6; }
  nav {
    display: grid; grid-template-columns: repeat(4, 1fr); flex-shrink: 0;
    border-top: 1px solid var(--border); background: #0e1116;
    padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
  }
  nav button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font-size: .62rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 8px 4px; display: grid; gap: 4px; place-items: center;
  }
  nav button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  nav button.active { color: var(--orange); }
  .hint { margin-top: 12px; color: var(--muted); font-size: .75rem; text-align: center; max-width: 390px; }
</style>
</head>
<body>
  <div>
    <div class="phone" aria-label="Builds categories mock-up">
      <header>
        <h1>Shade Task Force</h1>
        <p>Clan Hub</p>
      </header>
      <div class="grid">
        <article class="card solo">
          <div class="viz" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" stroke="#ffb066" stroke-width="2.2">
              <circle cx="32" cy="18" r="8"/><path d="M20 52c2-12 8-18 12-18s10 6 12 18"/><path d="M32 34v8"/>
            </svg>
          </div>
          <h2>Solo</h2>
        </article>
        <article class="card team">
          <div class="viz" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" stroke="#5eead4" stroke-width="2.2">
              <circle cx="20" cy="20" r="6"/><circle cx="32" cy="16" r="7"/><circle cx="44" cy="20" r="6"/>
              <path d="M10 54c2-10 6-14 10-14s8 4 10 12M22 52c2-12 6-16 10-16s8 4 10 14M34 54c2-10 6-14 10-14s7 5 9 14"/>
            </svg>
          </div>
          <h2>Team</h2>
        </article>
        <article class="card incursion">
          <div class="viz" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" stroke="#fca5a5" stroke-width="2.2">
              <path d="M12 56V24l20-12 20 12v32"/><path d="M28 56V36h8v20"/><path d="M22 28h6M36 28h6"/>
            </svg>
          </div>
          <h2>Incursion</h2>
        </article>
        <article class="card escalation">
          <div class="viz" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" stroke="#d8b4fe" stroke-width="2.2">
              <path d="M12 48h10v8H12zM27 36h10v20H27zM42 22h10v34H42z"/><path d="M14 20l18-12 18 12"/>
            </svg>
          </div>
          <h2>Escalation</h2>
        </article>
        <article class="card raid">
          <div class="viz" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" stroke="#fcd34d" stroke-width="2.2">
              <path d="M32 8l18 8v12c0 14-8 22-18 26-10-4-18-12-18-26V16l18-8z"/>
              <circle cx="32" cy="28" r="6"/><path d="M24 40c4 4 12 4 16 0"/>
            </svg>
          </div>
          <h2>Raid</h2>
        </article>
        <article class="card pvp">
          <div class="viz" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" stroke="#93c5fd" stroke-width="2.2">
              <path d="M14 50L40 14l6 6L20 56z"/><path d="M50 50L24 14l-6 6L44 56z"/>
              <circle cx="32" cy="34" r="5"/>
            </svg>
          </div>
          <h2>PvP</h2>
        </article>
      </div>
      <nav aria-label="Bottom navigation">
        <button type="button">
          <svg viewBox="0 0 24 24"><path d="M5 4h14v4H5zM5 10h14v4H5zM5 16h10v4H5z"/></svg>
          Updates
        </button>
        <button type="button">
          <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
          Events
        </button>
        <button type="button" class="active" aria-current="page">
          <svg viewBox="0 0 24 24"><path d="M8 7h8v10H8z"/><path d="M5 9h3M16 9h3M5 15h3M16 15h3"/></svg>
          Builds
        </button>
        <button type="button">
          <svg viewBox="0 0 24 24"><path d="M6 7h12v12H6z"/><path d="M9 4h6v3H9z"/></svg>
          Resources
        </button>
      </nav>
    </div>
    <p class="hint">Visual mock-up only — category grid. Not the live site.</p>
  </div>
</body>
</html>
