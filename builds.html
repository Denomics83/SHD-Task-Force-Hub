<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0C0E">
  <title>Builds — Shade Task Force Hub</title>
  <link rel="icon" href="assets/clan-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="topbar-root"></div>

  <main class="wrap">
    <div class="eyebrow">Loadouts</div>
    <h1>Builds Encyclopedia</h1>
    <p class="lede">
      Inventory-style cards · attrs &amp; mods on each piece · cores
      <span style="color:#A43B3B">■ WD</span>
      <span style="color:#45618E">■ Armor</span>
      <span style="color:#FFD373">■ Skill</span>
      · <span id="build-count">6 builds</span>
    </p>

    <div class="filters" id="filters" role="toolbar" aria-label="Filter builds"></div>

    <div class="build-rail" id="build-rail"></div>
    <div class="empty-state" id="empty-state">No builds match this filter.</div>

    <footer class="site-foot">
      Y8S3 Red Horizon. Seed outlines from
      <a href="https://overgear.com/guides/division-2/best-builds-for-any-activities/" rel="noopener" target="_blank">Overgear (Sep 2026)</a>.
      Attribute values are priorities only — exact rolls not invented.
    </footer>
  </main>

  <div id="bottomnav-root"></div>
  <script src="js/common.js"></script>
  <script src="builds-data.js"></script>
  <script src="js/builds.js"></script>
</body>
</html>
