<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="stf-build" content="a171f07">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D10">
  <title>Builds — Shade Task Force Hub</title>
  <link rel="icon" href="assets/clan-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=a171f07">
</head>
<body class="page-builds is-grid">
  <div id="topbar-root"></div>

  <main id="cat-stage" class="cat-stage" aria-label="Build categories"></main>

  <div id="build-list" class="wrap build-list" hidden>
    <button type="button" class="back-link" id="list-back" hidden>← Categories</button>
    <h1 id="list-title">Builds</h1>
    <div id="list-rows" class="build-rows"></div>
  </div>

  <div id="build-detail" class="wrap build-detail" hidden>
    <button type="button" class="back-link" id="detail-back" hidden>← Builds</button>
    <div id="detail-body"></div>
  </div>

  <div id="bottomnav-root"></div>
  <script src="js/common.js?v=a171f07"></script>
  <script src="js/builds.js?v=a171f07"></script>
<script data-stf-toast>
(function () {
  var meta = document.querySelector('meta[name="stf-build"]');
  var current = meta ? meta.content : "";
  fetch("data/build-version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (doc) {
      if (!doc || !doc.version || doc.version === current) return;
      if (document.querySelector(".build-toast")) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "build-toast";
      btn.textContent = "New version available — tap to refresh";
      btn.addEventListener("click", function () { location.reload(); });
      document.body.appendChild(btn);
    })
    .catch(function () {});
})();
</script>
</body>
</html>
