name: Update targeted loot

# Daily reset is 08:00 UTC. Check shortly after, then once more if the board is late.
on:
  schedule:
    - cron: "15 8 * * *"
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ProtoTrack and update data/loot.json
        run: python3 scripts/update-loot.py

      - name: Commit when the loot date changed
        run: |
          if git diff --quiet -- data/loot.json; then
            echo "No loot change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/loot.json
          git commit -m "Update targeted loot"
          git push
