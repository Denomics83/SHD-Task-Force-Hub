<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="stf-build" content="20261030b">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D10">
  <title>Events — Shade Hub</title>
  <link rel="icon" href="assets/clan-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261030b">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body class="page-events">
  <div id="topbar-root"></div>

  <main class="event-stage">
    <div class="tl-screen" id="tl-screen">
      <a class="season-banner" id="season-banner" href="season.html">
        <span id="season-banner-label">Season</span>
        <strong id="season-banner-name"></strong>
      </a>
      <div class="tl-frame">
        <div class="hero-rail" id="hero-rail" tabindex="0" aria-label="Season and scheduled events">
          <p class="lede hero-loading">Loading events…</p>
        </div>
        <div class="tl-bar" aria-hidden="true"><span id="tl-thumb"></span></div>
      </div>
    </div>
    <article id="event-detail" class="event-detail wrap upd-detail" hidden></article>
  </main>
  <div id="bottomnav-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="js/supabase.js?v=20261030b"></script>
  <script src="js/common.js?v=20261030b"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/events.js?v=20261030b"></script>
<script data-stf-toast>
(function () {
  var meta = document.querySelector('meta[name="stf-build"]');
  var current = meta ? meta.content : "";
  fetch("data/build-version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (doc) {
      if (!doc || !doc.version || doc.version === current) return;
      if (document.querySelector(".build-toast")) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "build-toast";
      btn.textContent = "New version available — tap to refresh";
      btn.addEventListener("click", function () { location.reload(); });
      document.body.appendChild(btn);
    })
    .catch(function () {});
})();
</script>
</body>
</html>
